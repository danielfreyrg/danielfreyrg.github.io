<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <title>360° Video – Three.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">

  <!-- Three.js via importmap so `import 'three'` works in a plain script -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <img src="../merki.svg" alt="Merki Háskóla Íslands" class="logo">
  <h1 class="title">Vertu kennari eða eitthvað, <br>mig er í rauninni alveg sama</h1>
  <div class="cursor"></div>
  <button id="start-btn" type="button">Spila 360° myndband</button>

  <script type="module" src="./script.js"></script>
</body>
</html>
